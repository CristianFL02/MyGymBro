spring.application.name=mygymbro-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mygymbro}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
# Las sesiones no caducan. Solo los enlaces de confirmación tienen duración limitada.
mygymbro.auth.verification-ttl=PT24H
mygymbro.auth.public-base-url=${PUBLIC_BASE_URL:}
mygymbro.auth.mail-from=${MAIL_FROM:}
mygymbro.auth.google-client-id=${GOOGLE_CLIENT_ID:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
