# Base aislada por defecto. Para MySQL utilizar exclusivamente una base de pruebas vacía.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:mygymbro;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
